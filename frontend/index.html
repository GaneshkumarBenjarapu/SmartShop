<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop Store - Home</title>
    <!-- Base Layout Loader -->
    <script src="/static/layout.js" defer></script>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background-color: #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .badge {
            position: absolute;
            top: 160px;
            left: 15px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
        }

        .badge-blue {
            background-color: rgba(224, 231, 255, 0.85);
            color: #4f46e5;
        }

        .badge-green {
            background-color: rgba(209, 250, 229, 0.85);
            color: #059669;
        }

        .badge-red {
            background-color: rgba(254, 226, 226, 0.85);
            color: #dc2626;
        }

        .card-content {
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .category {
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            color: #4f46e5;
            letter-spacing: 0.5px;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: #d97706;
        }

        .rating i {
            font-size: 12px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            text-decoration: none;
        }

        .product-title:hover {
            color: #007185;
            text-decoration: none;
        }

        .product-desc {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
            margin: 0 0 20px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        /* Modal Overlay & Card styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 17, 25, 0.7);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 24px;
            padding: 35px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            transform: translateY(30px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content-card {
            transform: translateY(0);
        }

        .close-modal-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: none;
            border: none;
            font-size: 28px;
            color: #4a5568;
            cursor: pointer;
            line-height: 1;
        }

        .close-modal-btn:hover {
            color: #1a202c;
        }

        .modal-icon-container {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #a56df9 0%, #ffcda5 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 20px rgba(165, 109, 249, 0.3);
        }

        .modal-icon-container i {
            font-size: 32px;
            color: white;
        }

        .modal-content-card h2 {
            font-size: 26px;
            font-weight: 800;
            color: #1e293b;
            margin: 0 0 10px 0;
        }

        .modal-content-card p {
            font-size: 15px;
            color: #4a5568;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .modal-choices {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (min-width: 480px) {
            .modal-choices {
                grid-template-columns: 1fr 1fr;
            }
        }

        .modal-choice-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-decoration: none !important;
        }

        .choice-quiz {
            border-color: rgba(165, 109, 249, 0.15);
        }

        .choice-quiz:hover {
            border-color: #a56df9;
            box-shadow: 0 12px 25px rgba(165, 109, 249, 0.15);
            transform: translateY(-5px);
        }

        .choice-mood {
            border-color: rgba(99, 179, 237, 0.15);
        }

        .choice-mood:hover {
            border-color: #3182ce;
            box-shadow: 0 12px 25px rgba(99, 179, 237, 0.15);
            transform: translateY(-5px);
        }

        .choice-icon {
            font-size: 40px;
            transition: transform 0.3s;
        }

        .modal-choice-card:hover .choice-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .choice-text h3 {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #1e293b;
        }

        .choice-text p {
            font-size: 13px;
            color: #64748b;
            margin: 0;
            line-height: 1.5;
        }

        .btn-skip {
            background: none;
            border: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .btn-skip:hover {
            color: #1e293b;
        }

        @keyframes spark {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(5deg); }
        }
        .spark-effect {
            animation: spark 3s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="grid-container" id="products-grid">
            <p style="grid-column: 1/-1; text-align: center; font-size: 18px; color: #4a5568;">Loading products...</p>
        </div>
    </div>

    <!-- Personalization Modal container -->
    <div id="new-user-quiz-modal-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                  ? 'http://localhost:5000'
                  : 'https://smartshop-web.onrender.com';
                  
                const res = await fetch(`${API_URL}/`, { credentials: 'include' });
                const data = await res.json();
                
                // Render products
                const grid = document.getElementById('products-grid');
                grid.innerHTML = '';
                
                if (data.products && data.products.length > 0) {
                    data.products.forEach(p => {
                        const cheapestBadge = p.cheapest_platform ? `
                            <div style="font-size: 11px; margin-bottom: 12px; padding: 4px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; background-color: ${p.cheapest_platform === 'SmartShop' ? '#ecfdf5' : p.cheapest_platform === 'Amazon' ? '#fff7ed' : p.cheapest_platform === 'Flipkart' ? '#f0f9ff' : '#fff1f2'}; border: 1px solid ${p.cheapest_platform === 'SmartShop' ? '#10b981' : p.cheapest_platform === 'Amazon' ? '#fdba74' : p.cheapest_platform === 'Flipkart' ? '#7dd3fc' : '#fda4af'}; color: ${p.cheapest_platform === 'SmartShop' ? '#047857' : p.cheapest_platform === 'Amazon' ? '#c2410c' : p.cheapest_platform === 'Flipkart' ? '#0369a1' : '#be123c'}; font-weight: 600;">
                                <i class="fas fa-search-dollar"></i> Lowest on ${p.cheapest_platform}
                            </div>` : '';
                            
                        const badgeHtml = p.badge_text ? `
                            <div class="badge ${p.badge_class}">
                                <i class="fas ${p.badge_icon}"></i> ${p.badge_text}
                            </div>` : '';
                            
                        const fallbackImage = `this.onerror=null; this.src='/static/placeholders/${p.category === 'Toys' ? 'toys.svg' : p.category === 'Men Fashion' ? 'clothing.svg' : 'default.svg'}';`;

                        const cardHtml = `
                        <div class="product-card bg-${p.category.toLowerCase().replace(' ', '-')}">
                            <a href="/product/${p.id}">
                                <img src="${p.image}" alt="${p.name}" class="card-image" onerror="${fallbackImage}" style="object-position: center; border-bottom: 2px solid transparent;">
                            </a>
                            ${badgeHtml}
                            <div class="card-content">
                                <div class="card-header">
                                    <span class="category">${p.category}</span>
                                    <span class="rating"><i class="fas fa-star"></i> ${p.rating}</span>
                                </div>
                                <a href="/product/${p.id}" class="product-title">${p.name}</a>
                                <p class="product-desc">${p.description}</p>
                                ${cheapestBadge}
                                <div class="card-footer" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                    <div class="price">₹${p.price}</div>
                                    <a href="/product/${p.id}" style="background: #007185; color: white; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background 0.2s;" onmouseover="this.style.background='#005a6a';" onmouseout="this.style.background='#007185';">View Product</a>
                                </div>
                            </div>
                        </div>`;
                        grid.insertAdjacentHTML('beforeend', cardHtml);
                    });
                } else {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; font-size: 18px; color: #4a5568;">No products found.</p>';
                }

                // Check if we should show the modal
                if (data.show_new_user_modal) {
                    const modalHtml = `
                    <div id="new-user-quiz-modal" class="modal-overlay active">
                        <div class="modal-content-card">
                            <button class="close-modal-btn" onclick="closeQuizModal()" aria-label="Close modal">&times;</button>
                            
                            <div class="modal-icon-container">
                                <i class="fas fa-magic spark-effect"></i>
                            </div>
                            
                            <h2>Welcome to SmartShop! ✨</h2>
                            <p>Let's personalize your shopping experience. How would you like to discover products today?</p>
                            
                            <div class="modal-choices">
                                <a href="/quiz" class="modal-choice-card choice-quiz">
                                    <div class="choice-icon">🎯</div>
                                    <div class="choice-text">
                                        <h3>Shopping Quiz</h3>
                                        <p>Find perfect products matched to your category, budget, and priority!</p>
                                    </div>
                                </a>
                                
                                <a href="/mood" class="modal-choice-card choice-mood">
                                    <div class="choice-icon">😎</div>
                                    <div class="choice-text">
                                        <h3>Vibe Check</h3>
                                        <p>Match your current mood with handpicked recommendation lookbooks!</p>
                                    </div>
                                </a>
                            </div>
                            
                            <div class="modal-footer-action">
                                <button class="btn-skip" onclick="closeQuizModal()">Skip for now, I'll browse</button>
                            </div>
                        </div>
                    </div>`;
                    document.getElementById('new-user-quiz-modal-container').innerHTML = modalHtml;
                }
            } catch (err) {
                console.error("Failed to load products list:", err);
            }
        });

        window.closeQuizModal = function() {
            const modal = document.getElementById("new-user-quiz-modal");
            if (modal) {
                modal.classList.remove("active");
            }
        };
    </script>
</body>
</html>
